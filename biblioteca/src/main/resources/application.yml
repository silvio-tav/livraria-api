spring:
  application:
    name: biblioteca
  datasource:
    url: jdbc:h2:mem:livrariadb
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  springdoc:
    swagger-ui:
      path: swagger-ui.html

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console